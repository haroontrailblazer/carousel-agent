<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Factory</title>
    <meta name="description" content="Turn news into reviewed Instagram carousels." />
    <!-- The brand mark is one file, used for the tab icon and for every
         in-app logo (see components/layout/brand-logo.tsx). Same URL both
         places means the browser fetches it once and serves the sidebar mark
         from cache. -->
    <link rel="icon" href="/logo.webp" type="image/webp" />
    <script>
      // Apply the theme before first paint. Without this the page renders in
      // light mode and then snaps to dark, which reads as a broken app. Kept
      // inline and tiny on purpose - it must run before any stylesheet does.
      try {
        var stored = localStorage.getItem("carousel-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {
        /* private mode, blocked storage: light mode is a fine default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
