# Render Blueprint - deploys the Carousel Factory as three services from one
# Docker image. Point Render at this repo (New -> Blueprint) and it reads this.
#
# WHY NOT THE FREE PLAN for the review API: free web services spin down after
# ~15 minutes idle. review_api resumes the whole pipeline INSIDE the web process
# as a background asyncio task (see _spawn_resume, RESUME_TIMEOUT_S = 3600), so
# a spin-down mid-resume kills the run. Nothing is lost - _restore_pending_review
# puts the row back - but the approval silently does not take effect, which is a
# miserable thing to debug. Keep this one on a paid instance.

envVarGroups:
  # Entered once in the Render dashboard, shared by all three services.
  # sync: false = Render prompts for the value and never stores it in git.
  - name: carousel-shared
    envVars:
      # --- LLM / images ---
      - key: OPENAI_API_KEY
        sync: false

      # --- Supabase: database, storage, artifacts ---
      # Use the SESSION pooler host (port 5432), not the direct
      # db.<ref>.supabase.co (IPv6-only) and not the transaction pooler (6543,
      # no prepared statements - asyncpg needs them). Percent-encode any '@' in
      # the password as %40.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        value: us-west-1
      - key: MEDIA_BUCKET
        value: corousel-media

      # --- Telegram: the review channel ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # --- Review links ---
      # Set this to the review API's public URL after the FIRST deploy, e.g.
      # https://carousel-review-api.onrender.com  (Render cannot self-reference
      # a full URL in a blueprint, only a bare host). Telegram REJECTS a button
      # URL that is not publicly resolvable, so this must be the real https URL
      # or the approve/reject buttons degrade to plain text links.
      - key: REVIEW_API_BASE_URL
        sync: false

      # --- App ---
      - key: APP_NAME
        value: carousel_factory
      - key: MAX_REWORK_ROUNDS
        value: "5"
      - key: MAX_CAROUSEL_SLIDES
        value: "10"
      - key: PLANNER_MODEL
        value: openai/gpt-5.6-sol
      - key: UTILITY_MODEL
        value: openai/gpt-5.4-mini
      - key: PHRASING_MODEL
        value: openai/gpt-5.5
      - key: IMAGE_MODEL
        value: gpt-image-2

      # --- News sources (what the agent makes carousels about) ---
      - key: RSS_FEEDS
        sync: false

      # --- Instagram (publishing; leave unset until you have them) ---
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_API_VERSION
        value: v23.0

      # --- Gmail newsletter source is NOT used (Telegram is the review
      # channel, and RSS covers sourcing). Nothing Gmail-related is needed.

services:
  # ---------------------------------------------------------------------------
  # 1. Review API - serves the approve/reject pages and resumes paused runs.
  #    This replaces the cloudflared tunnel: its onrender.com URL is stable, so
  #    review links stop dying on every restart.
  # ---------------------------------------------------------------------------
  - type: web
    name: carousel-review-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # see the spin-down note at the top - do not downgrade to free
    healthCheckPath: /healthz
    envVars:
      - fromGroup: carousel-shared
    startCommand: uvicorn review_api.main:app --host 0.0.0.0 --port $PORT

  # ---------------------------------------------------------------------------
  # 2. Fetcher - polls RSS/YouTube into news_queue. Cheap and idempotent:
  #    enqueue_news dedupes on a URL hash, so re-running costs nothing.
  # ---------------------------------------------------------------------------
  - type: cron
    name: carousel-fetcher
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "0 * * * *" # hourly
    envVars:
      - fromGroup: carousel-shared
    dockerCommand: python -m fetcher.fetch_news --fetch

  # ---------------------------------------------------------------------------
  # 3. Runner - pops ONE queued item and runs it to the review pause, then
  #    exits. Deliberately one-at-a-time: a run costs real OpenAI money and
  #    ends by pinging you on Telegram, so a burst of them would be both
  #    expensive and unreviewable. Widen the schedule once you trust it.
  # ---------------------------------------------------------------------------
  - type: cron
    name: carousel-runner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "30 * * * *" # hourly, offset 30m so the fetcher has queued work
    envVars:
      - fromGroup: carousel-shared
    dockerCommand: python -m fetcher.fetch_news --run-one
